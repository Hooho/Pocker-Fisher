<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f2c"/>
      <stop offset="1" stop-color="#122318"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc766"/>
      <stop offset="1" stop-color="#f0973a"/>
    </linearGradient>
    <radialGradient id="chip" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff2c8"/>
      <stop offset="1" stop-color="#d1a24a"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#c9ad75" stroke-width="2.5"/>

  <!-- big fanned poker cards as background, occupying most of the icon -->
  <g>
    <rect x="8" y="6" width="54" height="76" rx="7" fill="#fbf7ec" stroke="#2a2f27" stroke-width="2" transform="rotate(-15 35 44)"/>
    <text x="16" y="34" transform="rotate(-15 35 44)" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#c0392b">K</text>
    <text x="15" y="60" transform="rotate(-15 35 44)" font-size="22" fill="#c0392b">♦</text>

    <rect x="58" y="12" width="54" height="76" rx="7" fill="#fbf7ec" stroke="#2a2f27" stroke-width="2" transform="rotate(13 85 50)"/>
    <text x="66" y="40" transform="rotate(13 85 50)" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1c1c1c">A</text>
    <text x="65" y="66" transform="rotate(13 85 50)" font-size="22" fill="#1c1c1c">♠</text>
  </g>

  <!-- water bubbles, fish pun -->
  <circle cx="20" cy="20" r="3.6" fill="#bcd9c4" opacity="0.55"/>
  <circle cx="14" cy="12" r="2.2" fill="#bcd9c4" opacity="0.5"/>

  <!-- poker chip the fish is "sitting" at -->
  <circle cx="64" cy="112" r="16" fill="url(#chip)" stroke="#8a6a2e" stroke-width="2"/>
  <circle cx="64" cy="112" r="10.5" fill="none" stroke="#8a6a2e" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- fish: one continuous silhouette, body tapering into a forked tail -->
  <path d="M92,90 C89,78 75,74 57,80 L39,73 L50,90 L39,107 L57,100 C75,106 89,102 92,90 Z"
        fill="url(#fish)" stroke="#c15f18" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- top fin -->
  <path d="M60 76 C64 62, 76 62, 78 74 C72 76, 66 76, 60 76 Z" fill="#e0812c"/>

  <!-- belly highlight -->
  <path d="M50 98 C62 104, 78 104, 86 94" fill="none" stroke="#ffe2a8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- full sunglasses: two lenses + bridge + temple arm -->
  <g>
    <path d="M70 82 L60 79" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="70" y="80" width="20" height="14" rx="6" fill="#1b1b1b"/>
    <rect x="88" y="82" width="7" height="4.5" rx="2" fill="#1b1b1b"/>
    <rect x="94" y="79" width="12" height="13" rx="5.5" fill="#1b1b1b"/>
    <path d="M76 84 L81 88" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M98 82 L102 85" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- toothpick / card-shark stub -->
  <path d="M90 100 L104 96" stroke="#caa06a" stroke-width="3" stroke-linecap="round"/>

  <!-- sly grin -->
  <path d="M86 102 C82 106, 74 106, 70 103" fill="none" stroke="#8a3d10" stroke-width="2.5" stroke-linecap="round"/>
</svg>
